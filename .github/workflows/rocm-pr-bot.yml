name: ROCm PR Bot

on:
  workflow_call:
    inputs:
      report_formats:
        required: false
        type: string
      skip_keywords:
        required: false
        type: string
      bot_repository:
        description: "Repo hosting the central bot code"
        required: false
        type: string
        default: ROCm/TheRock-PR-Bot
      bot_ref:
        description: "Branch of the central bot code (main or develop)"
        required: false
        type: string
        default: main
      required_check_runs:
        description: >-
          Comma/newline-separated CHECK-RUN names this bot should track and
          show in the results table (e.g. "Run hooks"). This is the job-level
          name: of the check as GitHub reports it, NOT the workflow name. Leave
          empty in repos that have no such check (e.g. no pre-commit) so no
          pending row is ever shown. Overrides checks.required_check_runs in
          the shared policy.yml.
        required: false
        type: string
        default: ""
    secrets:
      ROCM_PR_BOT_APPID:
        required: false
      ROCM_PRBOT_KEY:
        required: false

  workflow_dispatch:
  # SECURITY: pull_request_target runs in the BASE-repo context, so secrets and
  # a write token are available even for PRs opened from FORKS.
  #
  # This is SAFE here ONLY because this workflow:
  #   • NEVER checks out or executes PR head code (see checkout step below),
  #   • runs the TRUSTED policy_check.py / policy.yml from the base branch, and
  #   • reads all PR data via the GitHub API.
  # Do NOT add build/test/install steps that run PR-provided code, and do NOT
  # change the checkout to the PR head — that would create a "pwn request".
  # Refs:
  #   https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target
  #   https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [main , develop]
    types: [opened, synchronize, reopened, ready_for_review, edited]

  # Re-run when the required check workflow finishes so the results table flips
  # from ⏳ Pending to ✅/❌ — without the bot ever waiting or polling. We use
  # `workflow_run` (NOT `check_run`): GitHub deliberately suppresses `check_run`
  # re-triggers for checks created by Actions' GITHUB_TOKEN (recursion guard),
  # so the table would otherwise stay ⏳ until a human pushes/edits the PR.
  # `workflow_run` is not suppressed; the script resolves the PR from the head
  # SHA. The watched name must match the pre-commit workflow's `name:`.
  workflow_run:
    workflows: ["pre-commit"]
    types: [completed]

# Least privilege. Writes are needed to post the results comment and manage the
# "Not ready to Review" label; everything else stays read-only.
permissions:
  contents: read
  pull-requests: write   # post / update the policy results table comment
  issues: write          # add / remove the "Not ready to Review" label
  checks: read

# Avoid two runs racing on the same PR's comment/label (e.g. fast pushes).
# Use a distinct prefix from the caller workflow to prevent a concurrency
# deadlock — GitHub kills both if caller and callee share the same group name.
concurrency:
  group: rocm-pr-bot-callee-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true


jobs:
  policy:
    name: rocm-pr-bot
    runs-on: ubuntu-24.04
    # On workflow_run, only refresh for pre-commit runs tied to a PR. Push-to-
    # main pre-commit runs have no PR; the bot resolves the PR from the head SHA
    # and exits cleanly when none exists, so this just avoids a no-op job.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Detect GitHub App secrets
        id: app-secrets
        shell: bash
        env:
          APP_ID: ${{ secrets.ROCM_PR_BOT_APPID }}
          APP_KEY: ${{ secrets.ROCM_PRBOT_KEY }}
          BOT_REPOSITORY: ${{ inputs.bot_repository || 'ROCm/TheRock-PR-Bot' }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
          # Actions expressions have no split(); derive owner/name here.
          echo "bot_owner=${BOT_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "bot_repo=${BOT_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      # The default GITHUB_TOKEN is scoped to the CALLER repo only, so it cannot
      # read the private bot repo. Mint an App token scoped to the bot repo
      # (the App is installed there) and use it for checkout.
      - name: Create bot-repo read token
        id: bot-repo-token
        if: steps.app-secrets.outputs.available == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.2.0
        with:
          app-id: ${{ secrets.ROCM_PR_BOT_APPID }}
          private-key: ${{ secrets.ROCM_PRBOT_KEY }}
          owner: ${{ steps.app-secrets.outputs.bot_owner }}
          repositories: ${{ steps.app-secrets.outputs.bot_repo }}
          permission-contents: read

      - name: Fail fast if bot repo is unreachable
        if: steps.app-secrets.outputs.available != 'true'
        run: |
          echo "::error::ROCM_PR_BOT_APPID/ROCM_PRBOT_KEY not available." \
               "Define them in the CALLER repo — secrets in TheRock-PR-Bot are not visible here."
          exit 1

      # SECURITY: check out the TRUSTED central bot code, NEVER the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.bot_repository || 'ROCm/TheRock-PR-Bot' }}
          ref: ${{ inputs.bot_ref || 'main' }}
          token: ${{ steps.bot-repo-token.outputs.token || github.token }}
          path: rocm_pr_bot
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Token is scoped to the CALLER repo (where the app is installed).
      - name: Create GitHub App token
        id: app-token
        if: steps.app-secrets.outputs.available == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.2.0
        with:
          app-id: ${{ secrets.ROCM_PR_BOT_APPID }}
          private-key: ${{ secrets.ROCM_PRBOT_KEY }}
          # Scope the token to the minimum the bot needs instead of inheriting
          # the full installation permissions:
          #   pull-requests: write -> post / update the results table comment
          #   issues: write        -> add / remove "Not ready to Review" label
          #   contents: read       -> read repo metadata
          #   checks: read         -> read required check-run conclusions
          permission-pull-requests: write
          permission-issues: write
          # contents:read -> detect whether .github/workflows/pre-commit.yml
          #                  exists (is pre-commit applicable to this repo?)
          permission-contents: read
          # checks:read   -> read the pre-commit check-run's pass/fail/pending
          permission-checks: read

      # SECURITY: only fixed, trusted dependencies — never installed from the PR.
      - name: Install deps
        run: python -m pip install --upgrade pip requests pyyaml

      - name: Enforce policy
        working-directory: rocm_pr_bot/rocm_pr_bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          HAS_GITHUB_APP_TOKEN: ${{ steps.app-secrets.outputs.available }}
          POST_COMMENTS: ${{ steps.app-secrets.outputs.available }}
          MUTATE_PR: ${{ steps.app-secrets.outputs.available }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          REQUIRED_CHECK_RUNS: ${{ inputs.required_check_runs }}
        run: python policy_check.py
